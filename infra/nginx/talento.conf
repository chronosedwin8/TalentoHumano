# Public reverse proxy: one origin for the app and the API, so the session
# cookie stays first party and no CORS preflight is needed in production.

upstream talento_api {
    server api:3000;
    keepalive 16;
}

upstream talento_web {
    server web:80;
    keepalive 16;
}

# Uploads and exports are the only large bodies; everything else is small.
client_max_body_size 50m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name ${SERVER_NAME};

    # ACME challenge stays on plain HTTP; everything else is redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${SERVER_NAME};

    ssl_certificate     /etc/letsencrypt/live/${SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SERVER_NAME}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The block renderer embeds third party players inside a sandboxed iframe;
    # the allow-list itself is enforced in the application.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    access_log /var/log/nginx/talento.access.log;
    error_log  /var/log/nginx/talento.error.log warn;

    location /api/ {
        proxy_pass http://talento_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The API reads the client IP from here for its rate limits and audit.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://talento_api/health;
        access_log off;
    }

    # Real time notifications.
    location /socket.io/ {
        proxy_pass http://talento_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://talento_web;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
    }
}
